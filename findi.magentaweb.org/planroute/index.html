<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verkehrsverbundauswahl – FINDI</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Electrolize', sans-serif;
            background-color: #f3f3f3;
            color: #222;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        p {
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            background-color: #0077cc;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #005fa3;
        }

        footer {
            position: absolute;
            bottom: 10px;
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .btn {
                padding: 12px 24px;
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <h1>Wähle deinen Verkehrsverbund</h1>
    <p>Bitte wähle den Verkehrsverbund, für den du eine Route planen möchtest:</p>

    <div class="button-container">
        <a href="../vrs/" class="btn">VRS</a>
        <a href="../hvv/" class="btn">HVV</a>
        <a href="../mvv/" class="btn">MVV</a>
        <a href="../vbb/" class="btn">VBB</a>
    </div>

    <footer>
        FINDI Fahrinformationsdienst | FINDI bassiert auf den OpenData-API's der jeweiigen Verkehrunternehmen
    </footer>
</body>
</html>
