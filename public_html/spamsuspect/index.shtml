<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirect Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla&family=Nova+Square&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Nova Square', monospace; background:#000; color:#ff5555; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; margin:0; text-align:center; }
        h1 { font-family:'Nabla', monospace; font-size:4em; margin-bottom:0.2em; }
        h2 { margin-top:0; margin-bottom:0.5em; }
        .joke { font-size:1.2em; margin-bottom:1em; color:#ff9999; }
        .info { background:#111; border:1px solid #444; padding:20px; border-radius:10px; max-width:600px; text-align:left; }
        .info p { margin:0.5em 0; word-break:break-word; }
    </style>
</head>
<body>
    <h1>Redirecting you, please wait...</h1>
    <h2>Redirect Page</h2>
    <div class="joke">You will be redirected shortly... <a href="../spamverdacht">Press here if you are not automaticlly redirected</a></div>
    <div class="info">
        <p><strong>Referer:</strong> <!--#echo var="HTTP_REFERER" --></p>
        <p><strong>Remote Address:</strong> <!--#echo var="REMOTE_ADDR" --></p>
        <p><strong>Request URI:</strong> <!--#echo var="REQUEST_URI" --></p>
        <p><strong>Host:</strong> <!--#echo var="HTTP_HOST" --></p>
        <p><strong>User Agent:</strong> <!--#echo var="HTTP_USER_AGENT" --></p>
        <p><strong>Redirect Status:</strong> <!--#echo var="REDIRECT_STATUS" --></p>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = "https://www.magentaweb.org/spamverdacht"
        }, 5000);
    </script>
</body>
</html>
